plugins 
{
    id 'java'
}

group = 'com.github.francitoshi'
version = '0.1.16'
//remember to execute 'git tag -a x.x.x -m "Version x.x.x"'

repositories 
{
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
//run "./gradlew dependencies --configuration runtimeClasspath" to verify version problems
dependencies
{
    implementation 'com.github.francitoshi:nut-base:0.1.16'
    implementation 'com.github.francitoshi:nut-core:0.1.16'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'

    compileOnly 'org.apache.commons:commons-compress:1.26.2'
   
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'

    testImplementation 'org.apache.commons:commons-csv:1.14.0'
}

java 
{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
//    withJavadocJar()
}

wrapper 
{
    gradleVersion = "8.2"
    distributionType = Wrapper.DistributionType.ALL
}

test 
{
    useJUnitPlatform()
}
